spring:
  application:
    name: recipeweb

  datasource:
    url: jdbc:h2:file:./data/recipeweb;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
