
services:
  postgres-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: web
      POSTGRES_DB: recipeweb
    ports:
      - "5438:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe -d recipeweb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgresql_data:
    driver: local
